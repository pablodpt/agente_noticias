name: Agente de Noticias Financieras

on:
  schedule:
    # Cada 2 horas de lunes a viernes (hora UTC)
    # 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC = 7am-5pm hora Perú/Colombia/México (aprox.)
    - cron: '0 12,14,16,18,20,22 * * 1-5'
  workflow_dispatch:  # botón para probarlo manualmente

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar agente
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente.py
